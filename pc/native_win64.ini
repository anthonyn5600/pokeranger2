# Windows build from WSL: MinGW-w64 (posix threads) as the native compilers, so libntr's native libraries are
# Windows code too (WSL runs the .exe compiler checks). The sysroot holds SDL2's MinGW development files and enet:
# meson setup build-win --native-file native_win64.ini -Dbuild_target=win64 -Dc_args=-I<sysroot>/include
#   -Dcpp_args=-I<sysroot>/include -Dc_link_args=-L<sysroot>/lib -Dcpp_link_args=-L<sysroot>/lib
[binaries]
c = 'x86_64-w64-mingw32-gcc-posix'
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
